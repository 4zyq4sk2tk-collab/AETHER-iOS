name: AETHER Native iOS ARM64 IPA Build

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'million-sim.css'
      - 'aether-kernel-v10.js'
      - 'real-investment-guide.js'
      - 'million-sim-app.js'
      - 'sw.js'
      - 'manifest.json'
      - 'apple-touch-icon.png'
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native ARM64 Mach-O iOS App & Package Hardened IPA
        shell: zsh {0}
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using iPhoneOS SDK: $SDK_PATH"

          rm -rf build-ios AETHER-iOS.ipa
          mkdir -p build-ios/Payload/AETHER.app/www

          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -framework UIKit \
            -framework CoreGraphics \
            -framework WebKit \
            -framework SafariServices \
            -framework UserNotifications \
            -framework Foundation \
            ios/main.m \
            -o build-ios/Payload/AETHER.app/AETHER

          chmod +x build-ios/Payload/AETHER.app/AETHER
          xcrun strip -rSTx build-ios/Payload/AETHER.app/AETHER
          file build-ios/Payload/AETHER.app/AETHER

          cp ios/Info.plist build-ios/Payload/AETHER.app/Info.plist
          plutil -convert binary1 build-ios/Payload/AETHER.app/Info.plist
          printf "APPL????" > build-ios/Payload/AETHER.app/PkgInfo

          sips -z 120 120 apple-touch-icon.png --out build-ios/Payload/AETHER.app/AppIcon60x60@2x.png >/dev/null
          sips -z 180 180 apple-touch-icon.png --out build-ios/Payload/AETHER.app/AppIcon60x60@3x.png >/dev/null

          cp index.html million-sim.css aether-data-bundle.js aether-kernel-v10.js real-investment-guide.js million-sim-app.js manifest.json sw.js apple-touch-icon.png apple-touch-icon.svg build-ios/Payload/AETHER.app/www/

          codesign --force --deep --sign - --timestamp=none build-ios/Payload/AETHER.app
          (cd build-ios && ditto -c -k --sequesterRsrc --keepParent Payload ../AETHER-iOS.ipa)
          ls -lh AETHER-iOS.ipa

      - name: Upload AETHER-iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-iOS
          path: AETHER-iOS.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.0.0-ios
          name: "AETHER v14.0 — Tam Ekran Native Mobil Yatırım Meydanı, Sokak Zekâsı Pusulası ve Canlı Lig (ARM64 iOS IPA)"
          files: AETHER-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
