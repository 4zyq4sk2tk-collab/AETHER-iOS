<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AETHER" />
  <meta name="theme-color" content="#f7f3eb" />
  <title>AETHER — Yaşayan Türkiye Ekonomisi, Zaman Tüneli ve Aile Kileri</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="aether-v10.css?v=10.0.0" />
</head>
<body>
  <header class="v10-topbar">
    <div class="v10-topbar-inner">
      <div class="v10-brand">
        <div class="v10-brand-mark">AE</div>
        <div>
          <div class="v10-brand-title">AETHER · Memleket ve Aile Kileri</div>
          <div class="v10-brand-clock" id="v10ClockLine">İstanbul saati yükleniyor...</div>
        </div>
      </div>
      <div class="v10-top-metrics" id="v10TopMetrics"></div>
    </div>
  </header>

  <nav class="v10-nav" aria-label="Ana Mekânlar">
    <button type="button" class="v10-nav-btn active" data-space="map">1. Memleket Haritası</button>
    <button type="button" class="v10-nav-btn" data-space="arena">2. Zaman Tüneli (10 Yıl)</button>
    <button type="button" class="v10-nav-btn" data-space="vault">3. Kilerim & Ayna</button>
    <button type="button" class="v10-nav-btn" data-space="family">4. Aile Çay Masası</button>
  </nav>

  <main class="v10-main" id="v10MainStage"></main>

  <!-- 360° Dükkân Arka Mutfağı ve İki Kapılı Canlı Gişe Çekmecesi -->
  <div class="v10-drawer-backdrop" id="v10WorkshopDrawer">
    <div class="v10-drawer-sheet" id="v10DrawerBody"></div>
  </div>

  <script src="aether-data-bundle.js?v=10.0.0"></script>
  <script src="aether-history-121m.js?v=10.0.0"></script>
  <script src="aether-kernel-v10.js?v=10.0.0"></script>
  <script src="aether-canvas-world-v10.js?v=10.0.0"></script>
  <script src="aether-arena-120m-v10.js?v=10.0.0"></script>
  <script>
    (function () {
      'use strict';

      let currentSpace = 'map';
      const stage = document.getElementById('v10MainStage');

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function fmtTL(n) {
        return Math.round(Number(n) || 0).toLocaleString('tr-TR') + ' ₺';
      }

      function renderTopBar() {
        const K = window.AetherKernelV10;
        if (!K) return;
        const clock = K.getTurkishClock();
        const snap = K.evaluateMemberPortfolio();
        const clockEl = document.getElementById('v10ClockLine');
        if (clockEl) {
          clockEl.textContent = `${clock.ymd} · ${clock.timeStr} · ${clock.bistLabel}`;
        }
        const metEl = document.getElementById('v10TopMetrics');
        if (metEl) {
          metEl.innerHTML = `
            <span class="v10-chip ${clock.bistCanMatchNow ? 'live-open' : 'live-closed'}">${clock.bistCanMatchNow ? 'BIST Seansı Açık' : 'BIST Kapalı'}</span>
            <span class="v10-chip">Aktif Kiler: <strong>${esc(snap.name)}</strong></span>
            <span class="v10-chip">Net Kiler: <strong>${fmtTL(snap.totalNetWorthTL)}</strong></span>
            <span class="v10-chip">Özgürlük Gücü: <strong>${snap.freedomMonths} Ay</strong></span>
          `;
        }
      }

      // ----------------------------------------------------------------------
      // MEKÂN 3: KİLERİM, TAKAS KUM SAATİ, AYRI VADE DİLİMLERİ & SESSİZ AYNA
      // ----------------------------------------------------------------------
      function renderVaultSpace() {
        const K = window.AetherKernelV10;
        const member = K.getActiveMember();
        const snap = K.evaluateMemberPortfolio(member);
        const clock = K.getTurkishClock();
        const idle = member.idleErosionLog || { cumulativeInflationLossTL: 0, missedSukukNetTL: 0 };

        stage.innerHTML = `
          <section class="v10-panel-card">
            <div class="v10-eyebrow">Tekil Gerçek Defter · Stopaj ve Yİ-ÜFE Düşülmüş Net Alım Gücü</div>
            <h2 class="v10-sec-title">${esc(snap.name)} — Ev Kileri ve Finansal Özgürlük Saati</h2>
            <p class="v10-sec-sub">Hiçbir işleme izinli saat ve takas kuralı dışında arka kapı yoktur. Tüm rakamlar vergi karşılıkları düşülmüş net kiler değeridir.</p>

            <div class="v10-pantry-hud" style="margin-top:14px">
              <div class="v10-hud-card highlight">
                <span>Vergi Sonrası Toplam Net Kiler</span>
                <strong>${fmtTL(snap.totalNetWorthTL)}</strong>
                <small>Nominal fark: ${snap.nominalPnlTL >= 0 ? '+' : ''}${fmtTL(snap.nominalPnlTL)} (${snap.nominalPnlPct >= 0 ? '+' : ''}%${snap.nominalPnlPct})</small>
              </div>
              <div class="v10-hud-card">
                <span>Finansal Özgürlük Gücü</span>
                <strong>${snap.freedomMonths} Aylık Ev Gideri</strong>
                <small>Aylık ev faturası: ${fmtTL(snap.monthlyExpense)} · Enflasyon sonrası reel durum: ${snap.realPurchasingPnlPct >= 0 ? '+' : ''}%${snap.realPurchasingPnlPct}</small>
              </div>
              <div class="v10-hud-card">
                <span>Anında Çekilebilir Nakit vs. Takas</span>
                <strong>${fmtTL(snap.cashTL)}</strong>
                <small>T+2 Takas Kum Saatinde: ${fmtTL(snap.unsettledTL)} · Valör/Açılış Sırasında: ${fmtTL(snap.pendingOrderTL)}</small>
              </div>
              <div class="v10-hud-card">
                <span>Dağılan Harita Sisi (Yaşanmışlık)</span>
                <strong>${snap.clearedCloudsCount} / 4 İleri Bölge Açık</strong>
                <small>Hileli buton yok; karar verdikçe ve takas bekledikçe sis kendiliğinden dağılır.</small>
              </div>
            </div>
          </section>

          <div class="v10-two-col">
            <section class="v10-panel-card">
              <div class="v10-eyebrow">Ortaklıklar, Madenler ve Ayrı Vade Dilimleri</div>
              <h3 class="v10-sec-title">Kilerdeki Varlıklar</h3>

              ${(member.settlementQueue || []).length > 0 ? `
                <div class="v10-rule-banner">
                  <strong>T+2 Takas Kum Saati İşliyor:</strong>
                  ${member.settlementQueue.map((q) => `<div>${esc(q.ticker)}: ${fmtTL(q.grossTL)} — ${esc(q.note)}</div>`).join('')}
                </div>
              ` : ''}

              ${(member.pendingOrders || []).length > 0 ? `
                <div class="v10-rule-banner">
                  <strong>Valör / Açılış Zili Kuyruğundaki Emirler:</strong>
                  ${member.pendingOrders.map((o) => `<div>${esc(o.name)} (${o.side === 'BUY' ? fmtTL(o.reservedTL) : o.qty + ' adet'}) — ${esc(o.note)}</div>`).join('')}
                </div>
              ` : ''}

              <div class="v10-list-stack">
                ${snap.tranches.map((tr) => `
                  <div class="v10-row-item">
                    <div>
                      <strong>${esc(tr.name)}</strong>
                      <div style="font-size:12.5px;color:#44403c">
                        Anapara: ${fmtTL(tr.principalTL)} · Net Biriken: +${fmtTL(tr.netInterestTL)} (%${tr.stopajPct} stopaj düşüldü)
                        ${tr.isTermDeposit && !tr.isMatured ? ` · Vadeye kalan: <strong>${tr.remainingDays} gün</strong>` : ''}
                      </div>
                    </div>
                    <button type="button" class="v10-btn-${tr.isTermDeposit && !tr.isMatured ? 'danger' : 'ghost'} sm" data-break-tranche="${esc(tr.id)}">
                      ${tr.isTermDeposit && !tr.isMatured ? `Erken Boz (${fmtTL(tr.forfeitedIfBrokenEarlyTL)} Faiz Yanar!)` : 'Nakde Çevir'}
                    </button>
                  </div>
                `).join('')}

                ${snap.spotItems.map((item) => `
                  <div class="v10-row-item">
                    <div>
                      <strong>${esc(item.name)} (${item.qty} birim)</strong>
                      <div style="font-size:12.5px;color:#44403c">
                        Vergi sonrası net değer: <strong>${fmtTL(item.netValTL)}</strong>
                        (${item.pnlNetTL >= 0 ? '+' : ''}${fmtTL(item.pnlNetTL)} / ${item.pnlNetPct >= 0 ? '+' : ''}%${item.pnlNetPct})
                        ${item.unrealizedStopajTL > 0 ? ` · Stopaj karşılığı: ${fmtTL(item.unrealizedStopajTL)}` : ''}
                        ${item.unrealizedGvk80TL > 0 ? ` · Yİ-ÜFE sonrası GVK Mük.80 karşılığı: ${fmtTL(item.unrealizedGvk80TL)}` : ''}
                      </div>
                    </div>
                    <button type="button" class="v10-btn-ghost sm" data-open-pos="${esc(item.assetKey)}">Gişeyi Aç</button>
                  </div>
                `).join('')}

                ${snap.tranches.length === 0 && snap.spotItems.length === 0 ? `
                  <p style="font-size:13.5px;color:#57534e">Kilerinde henüz bağlanmış bir maden, kalkan veya şirket ortaklığı yok; tüm paran (${fmtTL(snap.cashTL)}) açıkta enflasyona karşı bekliyor. Memleket Haritasından bir dükkâna girerek ilk adımını atabilirsin.</p>
                ` : ''}
              </div>
            </section>

            <section class="v10-panel-card">
              <div class="v10-eyebrow">Görmüş Geçirmiş Dost Gözüyle · Ucuz Puan Yok</div>
              <h3 class="v10-sec-title">Sessiz Ayna ve Uçup Giden Fırsat Kavanozu</h3>

              <div class="v10-scale-box warn">
                <div class="v10-scale-title">Korkup Boş Nakitte Beklemenin Sessiz Faturası</div>
                <p class="v10-scale-note" style="margin-top:0">
                  Açıkta duran TL naktinin enflasyon karşısında eriyen kısmı: <strong>${fmtTL(idle.cumulativeInflationLossTL)}</strong> ·
                  Aynı para %0 stopajlı Hazine Kira Sertifikasında dursaydı kazanacağı net kira: <strong>${fmtTL(idle.missedSukukNetTL)}</strong>.
                </p>
              </div>

              <div class="v10-list-stack">
                ${(member.footprints || []).length > 0
                  ? member.footprints.map((fp) => `
                    <div class="v10-row-item">
                      <div>
                        <strong>${esc(fp.title)}</strong>
                        <div style="font-size:12.5px;color:#44403c">${esc(fp.detail)}</div>
                      </div>
                      ${fp.leakTL > 0 ? `<span class="v10-shop-chg neg">-${fmtTL(fp.leakTL)}</span>` : ''}
                    </div>
                  `).join('')
                  : `<p style="font-size:13.2px;color:#57534e">Henüz panik satışı, gece banka makası veya sürü zirvesi kovalama izin düşmedi. Yaptığın her gerçek tercihin izi aylar içinde burada birikir.</p>`
                }
              </div>

              <hr style="border:none;border-top:1px solid #dfd6c7;margin:16px 0" />
              <div class="v10-eyebrow">Gerçek Takvim Maaş Günü & Ev Gideri Ayarı</div>
              <div class="v10-list-stack">
                <label style="font-size:12.8px">Aylık Ev Faturası (Özgürlük hesabı için ₺):
                  <input id="inpVaultExpense" class="v10-input" type="number" min="5000" step="1000" value="${member.monthlyExpenseTL}" />
                </label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <label style="font-size:12.8px">Maaş Günü:
                    <select id="selVaultSalaryDay" class="v10-input">
                      <option value="1" ${Number(member.salaryDay) === 1 ? 'selected' : ''}>Her Ayın 1'i</option>
                      <option value="15" ${Number(member.salaryDay) !== 1 ? 'selected' : ''}>Her Ayın 15'i</option>
                    </select>
                  </label>
                  <label style="font-size:12.8px">Aylık Taze Birikim (₺):
                    <input id="inpVaultSavings" class="v10-input" type="number" min="0" step="500" value="${member.monthlySavingsTL}" />
                  </label>
                </div>
                <label style="font-size:12.8px">Baştan Temiz Başlangıç Nakdi Beyan Et (İsteğe bağlı, mevcut sanal pozisyonları sıfırlar):
                  <input id="inpVaultResetCash" class="v10-input" type="number" min="0" step="5000" placeholder="Değiştirmek istemiyorsan boş bırak" />
                </label>
                <button type="button" class="v10-btn-primary" id="btnSaveHousehold">Ev ve Maaş Ayarlarını Kaydet</button>
              </div>
            </section>
          </div>
        `;

        stage.querySelectorAll('[data-break-tranche]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-break-tranche');
            window.AetherKernelV10.executeOrder({ side: 'BREAK_TRANCHE', trancheId: id });
            renderVaultSpace();
          });
        });

        stage.querySelectorAll('[data-open-pos]').forEach((btn) => {
          btn.addEventListener('click', () => {
            window.AetherCanvasWorldV10.openWorkshopDrawer(btn.getAttribute('data-open-pos'));
          });
        });

        document.getElementById('btnSaveHousehold')?.addEventListener('click', () => {
          const exp = Number(document.getElementById('inpVaultExpense')?.value || 35000);
          const sDay = Number(document.getElementById('selVaultSalaryDay')?.value || 15);
          const sav = Number(document.getElementById('inpVaultSavings')?.value || 0);
          const resetVal = Number(document.getElementById('inpVaultResetCash')?.value || 0);
          window.AetherKernelV10.updateHouseholdBaseline({
            monthlyExpenseTL: exp,
            salaryDay: sDay,
            monthlySavingsTL: sav,
            resetCashBaselineTL: resetVal >= 1000 ? resetVal : null
          });
          renderVaultSpace();
        });
      }

      // ----------------------------------------------------------------------
      // MEKÂN 4: AİLE ÇAY MASASI (AÇIK PORTFÖYLER, HAMLE SOHBETİ & ÇOKLU İPHONE EŞİTLEME)
      // ----------------------------------------------------------------------
      function renderFamilySpace() {
        const K = window.AetherKernelV10;
        const st = K.getState();
        const sharePack = K.exportFamilySharePacket();

        // Kimin çok para kazandığını değil, enflasyona karşı gemisini sağlam tutanı öne çıkar
        const evaluatedMembers = st.members
          .map((m) => ({ raw: m, snap: K.evaluateMemberPortfolio(m) }))
          .sort((a, b) => b.snap.realPurchasingPnlPct - a.snap.realPurchasingPnlPct);

        stage.innerHTML = `
          <section class="v10-panel-card">
            <div class="v10-eyebrow">Aile İçi Tam Şeffaflık · Kim Gemisini Fırtınada Batırmadan Limana Yanaştırıyor?</div>
            <h2 class="v10-sec-title">Akşam Çayı Salonu — Açık Kilerler ve Muhabbet Masası</h2>
            <p class="v10-sec-sub">Evdeki herkes birbirinin portföyünü, kârını, zararını ve son hamlesini açıkça görür. Sıralama kuru paraya göre değil, enflasyona karşı gerçek alım gücünü koruma ustalığına göredir.</p>

            <div class="v10-family-grid">
              ${evaluatedMembers.map(({ raw, snap }) => {
                const isActive = raw.id === st.activeMemberId;
                const lastMove = (raw.tradeHistory || [])[0] || null;
                const holdingsSummary = [
                  ...snap.tranches.map((t) => `${t.name}: ${fmtTL(t.accruedNetValueTL)}`),
                  ...snap.spotItems.map((s) => `${s.ticker}: ${fmtTL(s.netValTL)} (${s.pnlNetPct >= 0 ? '+' : ''}%${s.pnlNetPct})`),
                  ...(raw.pendingOrders || []).map((o) => `Sırada ${o.name}: ${o.side === 'BUY' ? fmtTL(o.reservedTL) : o.qty + ' adet'}`),
                  ...(raw.settlementQueue || []).map((q) => `T+2 Takasta ${q.ticker}: ${fmtTL(q.grossTL)}`)
                ];
                return `
                  <article class="v10-member-card ${isActive ? 'active-member' : ''}">
                    <div class="v10-shop-top">
                      <span class="v10-shop-badge tone-${snap.realPurchasingPnlPct >= 0 ? 'good' : 'warn'}">${esc(raw.roleLabel)}</span>
                      <strong class="v10-shop-chg ${snap.realPurchasingPnlPct >= 0 ? 'pos' : 'neg'}">Reel ${snap.realPurchasingPnlPct >= 0 ? '+' : ''}%${snap.realPurchasingPnlPct}</strong>
                    </div>
                    <h3 style="margin:0;font-size:17px">${esc(snap.name)} ${isActive ? '(Şu An Açık)' : ''}</h3>
                    <div style="font-size:13px;color:#44403c">
                      Net Kiler: <strong>${fmtTL(snap.totalNetWorthTL)}</strong> · Özgürlük: <strong>${snap.freedomMonths} Ay</strong> · Nakit: ${fmtTL(snap.cashTL)}
                    </div>
                    <div style="font-size:12.3px;background:#fffdf9;border:1px solid #dfd6c7;border-radius:9px;padding:8px">
                      <strong>Açık Sepeti:</strong>
                      ${holdingsSummary.length > 0 ? esc(holdingsSummary.join(' · ')) : 'Tamamı nakitte bekliyor'}
                    </div>
                    ${raw.arenaBestSummary ? `
                      <div style="font-size:12px;color:#0f766e;font-weight:600">
                        10 Yıl Tünel İzi: ${raw.arenaBestSummary.realFiles} Mutfak Filesi (En sert fırtına: %${raw.arenaBestSummary.maxRealDrawdownPct})
                      </div>
                    ` : ''}
                    <div style="font-size:12.2px;color:#57534e">
                      <strong>Son Hamle:</strong> ${lastMove ? `${esc(lastMove.side)} — ${esc(lastMove.name)} (${fmtTL(lastMove.amountTL)})` : 'Henüz hamle yapmadı'}
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:4px">
                      ${!isActive ? `<button type="button" class="v10-btn-primary sm" data-switch-member="${esc(raw.id)}">Bu Profile Geç</button>` : ''}
                      <button type="button" class="v10-btn-ghost sm" data-tease-member="${esc(snap.name)}" data-tease-move="${esc(lastMove ? lastMove.name : 'nakitte beklemek')}">Hamlesine Laf At</button>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          </section>

          <div class="v10-two-col">
            <section class="v10-panel-card">
              <div class="v10-eyebrow">Salon Muhabbeti</div>
              <h3 class="v10-sec-title">"Sen Niye Bugün Elindekini Sattın?"</h3>
              <div class="v10-order-row">
                <input id="inpTeaBanter" class="v10-input" type="text" placeholder="Çay masasına not bırak..." />
                <button type="button" class="v10-btn-primary" id="btnSendBanter">Masaya Yaz</button>
              </div>
              <div class="v10-banter-list">
                ${(st.banterFeed || []).map((b) => `
                  <div class="v10-banter-item">
                    <strong>${esc(b.authorName)}${b.targetName ? ' -> ' + esc(b.targetName) : ''}:</strong>
                    <span>${esc(b.text)}</span>
                  </div>
                `).join('')}
              </div>
            </section>

            <section class="v10-panel-card">
              <div class="v10-eyebrow">Yeni Aile Bireyi & Farklı Telefonları Eşitleme</div>
              <h3 class="v10-sec-title">Masaya Kişi Ekle veya Başka iPhone ile Eşitle</h3>

              <div class="v10-list-stack">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <input id="inpNewMemName" class="v10-input" type="text" placeholder="İsim (Örn: Anne, Baba, Kardeş)" />
                  <input id="inpNewMemRole" class="v10-input" type="text" placeholder="Unvan (Örn: Sabır Ustası)" />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                  <input id="inpNewMemCash" class="v10-input" type="number" min="1000" step="5000" value="100000" placeholder="Başlangıç Nakdi (₺)" />
                  <button type="button" class="v10-btn-secondary" id="btnAddFamilyMem">Masaya Ekle</button>
                </div>

                <hr style="border:none;border-top:1px solid #dfd6c7;margin:8px 0" />
                <div style="font-size:12.8px;color:#44403c">
                  <strong>Farklı Telefonlar Arası Canlı Salon Eşitleme:</strong> WhatsApp veya iMessage ile aile grubuna aşağıdaki bağlantıyı veya salon kodunu gönderdiğinde herkesin portföyü birleşir:
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  <button type="button" class="v10-btn-primary sm" id="btnShareFamilyLink">Aile Bağlantısını Paylaş / Kopyala</button>
                  <button type="button" class="v10-btn-ghost sm" id="btnCopySyncCode">Salon Kodunu Kopyala</button>
                </div>
                <div class="v10-order-row">
                  <input id="inpImportSyncCode" class="v10-input" type="text" placeholder="Aileden gelen bağlantıyı veya AETHER-SALON kodunu yapıştır..." />
                  <button type="button" class="v10-btn-secondary sm" id="btnImportSyncCode">Masayı Eşitle</button>
                </div>
                <div id="famSyncFeedback" class="v10-order-feedback"></div>
              </div>
            </section>
          </div>
        `;

        stage.querySelectorAll('[data-switch-member]').forEach((btn) => {
          btn.addEventListener('click', () => {
            K.switchActiveMember(btn.getAttribute('data-switch-member'));
            renderFamilySpace();
          });
        });

        stage.querySelectorAll('[data-tease-member]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-tease-member');
            const mv = btn.getAttribute('data-tease-move');
            const inp = document.getElementById('inpTeaBanter');
            if (inp) {
              inp.value = `${target}, bugün niye ${mv} hamlesi yaptın? Çayda anlat bakalım!`;
              inp.focus();
            }
          });
        });

        document.getElementById('btnSendBanter')?.addEventListener('click', () => {
          const inp = document.getElementById('inpTeaBanter');
          if (inp && inp.value.trim()) {
            K.postTeaBanter(inp.value);
            renderFamilySpace();
          }
        });

        document.getElementById('btnAddFamilyMem')?.addEventListener('click', () => {
          const name = document.getElementById('inpNewMemName')?.value || '';
          const role = document.getElementById('inpNewMemRole')?.value || 'Aile Üyesi';
          const cash = Number(document.getElementById('inpNewMemCash')?.value || 100000);
          const res = K.addFamilyMember(name, role, 35000, cash);
          if (res.ok) renderFamilySpace();
        });

        const showFamMsg = (ok, txt) => {
          const el = document.getElementById('famSyncFeedback');
          if (el) {
            el.className = 'v10-order-feedback ' + (ok ? 'ok' : 'err');
            el.textContent = txt;
          }
        };

        document.getElementById('btnShareFamilyLink')?.addEventListener('click', async () => {
          if (navigator.share) {
            try {
              await navigator.share({ title: 'AETHER Aile Çay Masası', url: sharePack.shareUrl });
              showFamMsg(true, 'Aile bağlantısı paylaşıldı.');
              return;
            } catch (_) {}
          }
          try {
            await navigator.clipboard.writeText(sharePack.shareUrl);
            showFamMsg(true, 'Kanonik HTTPS aile bağlantısı panoya kopyalandı!');
          } catch (_) {
            showFamMsg(true, sharePack.shareUrl);
          }
        });

        document.getElementById('btnCopySyncCode')?.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(sharePack.syncCode);
            showFamMsg(true, 'AETHER-SALON eşitleme kodu kopyalandı; WhatsApp grubuna yapıştırabilirsin.');
          } catch (_) {
            showFamMsg(true, sharePack.syncCode);
          }
        });

        document.getElementById('btnImportSyncCode')?.addEventListener('click', () => {
          const raw = document.getElementById('inpImportSyncCode')?.value || '';
          const res = K.importFamilySharePacket(raw);
          if (res.ok) {
            renderFamilySpace();
            showFamMsg(true, `${res.count} aile üyesinin kileri ve sohbeti başarıyla masaya eşitlendi!`);
          } else {
            showFamMsg(false, res.reason);
          }
        });
      }

      function switchSpace(spaceName) {
        if (currentSpace === 'arena' && spaceName !== 'arena') {
          window.AetherArena120mV10?.unmount();
        }
        currentSpace = spaceName;
        document.querySelectorAll('.v10-nav-btn').forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-space') === spaceName);
        });

        if (spaceName === 'map') {
          window.AetherCanvasWorldV10.mount(stage);
        } else if (spaceName === 'arena') {
          window.AetherArena120mV10.mount(stage);
        } else if (spaceName === 'vault') {
          renderVaultSpace();
        } else if (spaceName === 'family') {
          renderFamilySpace();
        }
        renderTopBar();
      }

      window.AetherSwitchSpace = switchSpace;

      document.querySelectorAll('.v10-nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => switchSpace(btn.getAttribute('data-space')));
      });

      document.getElementById('v10WorkshopDrawer')?.addEventListener('click', (ev) => {
        if (ev.target && ev.target.id === 'v10WorkshopDrawer') {
          window.AetherCanvasWorldV10.closeWorkshopDrawer();
        }
      });

      // Başlatma
      window.AetherKernelV10.init();
      window.AetherKernelV10.subscribe(() => {
        renderTopBar();
        if (currentSpace === 'vault') renderVaultSpace();
      });

      switchSpace('map');
      setInterval(renderTopBar, 1000);

      if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
